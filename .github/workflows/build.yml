# Name for the workflow
name: Build Docker Image

# Runs workflow whenever someone pushes a commit to the main branch
on:
  push:
    branches: [main]

# A job for the workflow with name build
jobs:
  build:
    # To run the job on a fresh Ubuntu Linux VM
    runs-on: ubuntu-latest

    permissions:
      contents: read # gives permission to read the GitHub repo's files
      packages: write # Gives permission to publish/upload the image

    steps:
      - name: Check out Repo
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3 # Specific pre-built action
        with:
          registry: ghcr.io # Storage server for Docker images so its accesible from anywhere
          username: ${{github.actor}} # Holds github username of whoever triggered the run
          password: ${{secrets.GITHUB_TOKEN}} # auto-generated token by GH every single workflow run then destroyed after

      - name: Build and Push Docker Image 
        uses: docker/build-push-action@v6 # Builds and Docker image and pushes it into a registry
        with: 
          context: . # Tells where Dockerfile and code are located
          push: true # Push image after building
          tags: ghcr.io/youssef080808/telegram_bot:latest # Full name/address image will be given once uploaded

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Deploy new image to EC2 via SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "docker pull ghcr.io/youssef080808/telegram_bot:latest",
              "docker rm -f telegram-bot",
              "docker run -d --name telegram-bot --restart unless-stopped --env-file /etc/telegram-bot.env -v /home/ec2-user/data:/data ghcr.io/youssef080808/telegram_bot:latest"
            ]'
